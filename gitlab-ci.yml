name: Python Test

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull your code onto the runner
    - uses: actions/checkout@v4

    # 2. Set up Python 3.12
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # 3. Install pytest
    - name: Install dependencies
      run: |
        pip install pytest

    # 4. Run pytest
    - name: Run tests
      run: |
        pytest